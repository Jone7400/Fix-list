<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>FixList</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc}main{max-width:680px;margin:auto;padding:30px 18px 110px}h1{font-size:32px;margin:0 0 5px}.sub{color:#94a3b8;margin:0 0 25px}.listbar{display:flex;gap:8px;align-items:center;margin:18px 0 8px}.listbar select{flex:1;min-width:0;background:#172235;color:white;border:1px solid #334155;border-radius:12px;padding:13px;font-size:16px}.small{padding:12px;background:#334155;color:white}.listtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.listtools button{background:#1e293b;color:#cbd5e1;padding:9px 12px;font-size:13px}.note{background:#172235;border:1px solid #334155;border-radius:16px;padding:13px;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center;color:#94a3b8;font-size:13px;margin-bottom:9px}textarea{width:100%;min-height:100px;resize:vertical;border:0;outline:0;background:transparent;color:white;font:16px/1.5 inherit;font-family:inherit}button{border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:650;cursor:pointer}button:active{opacity:.7}.remove{background:transparent;color:#fca5a5;padding:5px 8px}.add{background:#334155;color:white;width:100%;margin:10px 0 20px}.actions{display:flex;gap:10px}.copy{background:#5b8cff;color:#fff;flex:1}.clear{background:#293449;color:#fca5a5}.hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:20px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#dcfce7;color:#14532d;padding:12px 20px;border-radius:12px;display:none;white-space:nowrap}</style></head><body><main><h1>FixList ✍️</h1><p class="sub">Saml fejl, rettelser og idéer til dit spil.</p><div class="listbar"><select id="lists" aria-label="Vælg liste"></select><button class="small" id="newlist">+ Ny liste</button></div><div class="listtools"><button id="rename">Omdøb liste</button><button id="deletelist">Slet liste</button></div><div id="notes"></div><button class="add" id="add">+ Tilføj nyt felt</button><div class="actions"><button class="copy" id="copy">Kopier alle noter</button><button class="clear" id="clear">Ryd liste</button></div><p class="hint">Gemmes automatisk på denne enhed.</p></main><div id="toast" role="status">Kopieret!</div><script>
const KEY='fixlist-v2',OLD='fixlist-v1';
let data;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data||!Array.isArray(data.lists)||!data.lists.length){let old;try{old=JSON.parse(localStorage.getItem(OLD))}catch(e){};data={active:'first',lists:[{id:'first',name:'Mine noter',notes:Array.isArray(old)?old:['']}]}}
const root=document.querySelector('#notes'), picker=document.querySelector('#lists');
const current=()=>data.lists.find(l=>l.id===data.active)||data.lists[0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Kunne ikke gemme – lageret er fyldt')}};
function render(focus=-1){picker.replaceChildren();data.lists.forEach(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.name;picker.append(o)});picker.value=current().id;root.replaceChildren();const notes=current().notes;notes.forEach((value,i)=>{const card=document.createElement('section');card.className='note';const top=document.createElement('div');top.className='top';const number=document.createElement('span');number.textContent='Note '+(i+1);const del=document.createElement('button');del.className='remove';del.textContent='Slet';del.setAttribute('aria-label','Slet note '+(i+1));del.onclick=()=>{notes.splice(i,1);if(!notes.length)notes.push('');save();render()};top.append(number,del);const area=document.createElement('textarea');area.placeholder='Skriv din fejl, rettelse eller idé her…';area.value=value;area.setAttribute('aria-label','Note '+(i+1));area.oninput=()=>{notes[i]=area.value;save()};card.append(top,area);root.append(card);if(i===focus){area.focus();area.scrollIntoView({block:'nearest',behavior:'smooth'})}})}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',1800)}
picker.onchange=()=>{data.active=picker.value;save();render()};
document.querySelector('#newlist').onclick=()=>{const name=prompt('Navn på den nye liste:');if(!name||!name.trim())return;const id='list-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);data.lists.push({id,name:name.trim(),notes:['']});data.active=id;save();render(0)};
document.querySelector('#rename').onclick=()=>{const l=current();const name=prompt('Nyt navn på listen:',l.name);if(!name||!name.trim())return;l.name=name.trim();save();render()};
document.querySelector('#deletelist').onclick=()=>{const l=current();if(!confirm('Slet listen "'+l.name+'" og alle dens noter?'))return;if(data.lists.length===1){toast('Du skal have mindst én liste');return}data.lists=data.lists.filter(x=>x.id!==l.id);data.active=data.lists[0].id;save();render()};
document.querySelector('#add').onclick=()=>{const notes=current().notes;notes.push('');save();render(notes.length-1)};
document.querySelector('#copy').onclick=async()=>{const content=current().notes.map(x=>x.trim()).filter(Boolean).map((x,i)=>`${i+1}. ${x}`).join('\n\n');if(!content){toast('Ingen noter at kopiere');return}try{await navigator.clipboard.writeText(content);toast('Alle noter er kopieret!')}catch(e){const t=document.createElement('textarea');t.value=content;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Alle noter er kopieret!':'Kunne ikke kopiere')}};
document.querySelector('#clear').onclick=()=>{if(confirm('Vil du slette alle noter i "'+current().name+'"?')){current().notes=[''];save();render()}};
save();render();
</script></body></html>
